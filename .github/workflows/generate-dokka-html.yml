name: generate-dokka-html.yml
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read pinned JDK version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          jdk_version=$(sed -n 's/^jdk[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          test -n "$jdk_version"
          printf 'jdk_version=%s\n' "$jdk_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate aggregated Dokka docs
        run: ./gradlew dokkaGenerateHtml

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
