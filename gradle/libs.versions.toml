[versions]
# Minecraft 1.21.1 upwards uses Java 21
# 26.1 upwards uses Java 25
jdk = "25"

# Fabric Properties
# Check these on https://fabricmc.net/versions.html
# https://mods.upcraft.dev/dev/versions
minecraft = "26.2"
fabric-loom = "1.17-SNAPSHOT"
fabric-loader = "0.19.3"
fabric-loaderMin = "0.18.4"
fabric-api = "0.153.0+26.2"

# mcef
mcef = "3.4.0-26.2"
# MinecraftAuth (CCBlueX fork of RaphiMC/MinecraftAuth)
minecraftauth = "5.0.3-SNAPSHOT"
# TheAltening
thealtening = "4.1.0"
# https://mvnrepository.com/artifact/com.squareup.retrofit2/retrofit
retrofit = "3.0.0"
# Polyglot
polyglot = "25.0.3"
# djl
djl = "0.36.0"
# https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
okhttp = "5.5.0"

ktor = "3.5.2"
semver4j = "3.1.0"
ahocorasick = "0.6.3"
fastutil4k = "0.2.8"
discord-ipc = "-SNAPSHOT"

# Seed cracking (pinned to SeedCrackerX's Minecraft 26.2-compatible SeedFinding stack)
seedfinding-math = "851e9d0577dfdca50154e98f1d334bd31c641326"
seedfinding-seed = "55f6242001f7eb4226df4ed0d023f1838a54a99d"
seedfinding-core = "eee662999e9f3fe037476b6940dbd6d5e23cdbb6"
seedfinding-noise = "dbab3996ea3abff5dd420db53c31d5498afd2fe5"
seedfinding-biome = "17af8cb1110fdc983b7cb2b887d1fb2060e23ee3"
seedfinding-terrain = "a03e440ec5b282e399382f2cc5ad0db91b438d2e"
seedfinding-feature = "755d3611ac1c499c28289ccca5b738af6a5859b7"
seedfinding-reversal = "75aa6ce47a9f53a1aa212765e9830e08f6c86299"
latticg = "1.07"

# Recommended mods
modmenu = "20.0.0-beta.4"
exploit_preventer_api = "1.0.0"
exploit_preventer_mod = "1.1.0+26.2"
# Optional Litematica integration, pinned to the verified Minecraft 26.2 Modrinth artifacts.
litematica = "jzraAo7b" # 0.28.4
malilib = "xKxhjDJ2" # 0.29.3, last compatible release before MaLiLib requires Litematica 0.28.5
sodium = "mc26.2-0.9.0-fabric"
lithium = "mc26.2-0.25.0-fabric"
viafabricplus = "4.6.3"
# Mods for compatibility test (runtime only)
immediatelyFast = "1.16.0+26.2-fabric"
iris = "1.11.1+26.2-fabric"

# Kotlin
# https://kotlinlang.org/releases.html
kotlin = "2.4.0"
# Kotlin test
# https://central.sonatype.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-test/overview
kotlinx-coroutines = "1.11.0"
# https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/
fabric-kotlin = "1.13.12+kotlin.2.4.0"

# Netty, should be sync with game version
# https://mvnrepository.com/artifact/io.netty/netty-all
netty = "4.2.15.Final"

# LWJGL
lwjgl = "3.4.1"

# Other plugins
detekt = "2.0.0-alpha.6"
gradleGitProperties = "4.0.1"
dokka = "2.2.0"
nodeGradle = "7.1.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
